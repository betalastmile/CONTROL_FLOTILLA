<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flotilla Vehicular</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── DARK MODE (default) ── */
  :root {
    --bg:      #070a10;
    --bg2:     #0a0d14;
    --bg3:     #0f1117;
    --border:  #1a1f2e;
    --border2: #1e2530;
    --text:    #e2e8f0;
    --text2:   #94a3b8;
    --text3:   #475569;
    --text4:   #334155;
    --input-bg:#0a0d14;
    --input-color:#e2e8f0;
    --input-ph:#475569;
    --select-opt:#0a0d14;
    --modal-bg:#0f1117;
    --scroll-track:#0a0d14;
    --scroll-thumb:#2d3748;
    --label-color:#94a3b8;
    --info-bg:#070a10;
    --info-border:#1a1f2e;
    --info-lbl:#475569;
    --info-val:#e2e8f0;
    --card-bg:#0a0d14;
    --card-border:#1a1f2e;
    --toast-ok-bg:#052e16;
    --toast-err-bg:#1c0a0a;
  }

  /* ── LIGHT MODE ── */
  body.light {
    --bg:      #f0f4f8;
    --bg2:     #ffffff;
    --bg3:     #f8fafc;
    --border:  #dde3ec;
    --border2: #c8d2de;
    --text:    #0f172a;
    --text2:   #334155;
    --text3:   #64748b;
    --text4:   #94a3b8;
    --input-bg:#ffffff;
    --input-color:#0f172a;
    --input-ph:#94a3b8;
    --select-opt:#ffffff;
    --modal-bg:#ffffff;
    --scroll-track:#e2e8f0;
    --scroll-thumb:#94a3b8;
    --label-color:#475569;
    --info-bg:#f8fafc;
    --info-border:#dde3ec;
    --info-lbl:#64748b;
    --info-val:#0f172a;
    --card-bg:#ffffff;
    --card-border:#dde3ec;
    --toast-ok-bg:#dcfce7;
    --toast-err-bg:#fee2e2;
  }

  body { background:var(--bg); color:var(--text); font-family:'DM Sans','Segoe UI',system-ui,sans-serif; min-height:100vh; transition:background 0.25s,color 0.25s; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--scroll-track); border-radius:4px; }
  ::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#22d3ee; }

  /* ── INPUTS ── */
  input::placeholder, textarea::placeholder { color:var(--input-ph); }
  select option { background:var(--select-opt); color:var(--input-color); }
  input[type=text], input[type=number], input[type=date], input[type=file], select, textarea {
    background:var(--input-bg); border:1px solid var(--border2); color:var(--input-color);
    border-radius:8px; padding:10px 14px; font-size:14px; outline:none;
    font-family:inherit; width:100%; transition:border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color:#22d3ee; }
  textarea { resize:vertical; }
  label { color:var(--label-color); font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; display:block; margin-bottom:6px; }
  .field { display:flex; flex-direction:column; gap:4px; }

  /* ── ANIMATIONS ── */
  @keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeIn    { from{opacity:0} to{opacity:1} }

  /* ── CARDS ── */
  .card-hover { transition:border-color 0.2s,transform 0.15s,box-shadow 0.2s; }
  .card-hover:hover { border-color:#22d3ee !important; transform:translateY(-2px); box-shadow:0 8px 24px rgba(34,211,238,0.08); }

  /* ── BUTTONS ── */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border-radius:8px; padding:10px 18px; font-size:13px; font-weight:700; cursor:pointer; transition:opacity 0.15s,box-shadow 0.15s; letter-spacing:0.03em; border:none; font-family:inherit; }
  .btn:hover { opacity:0.82; }
  .btn-primary { background:#22d3ee; color:#000; }
  .btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border2); }
  .btn-ghost:hover { background:var(--bg2); opacity:1; }
  .btn-success { background:rgba(74,222,128,0.15); color:#4ade80; border:1px solid rgba(74,222,128,0.35); }
  .btn-danger  { background:rgba(248,113,113,0.15); color:#f87171; border:1px solid rgba(248,113,113,0.35); }
  body.light .btn-success { background:rgba(22,163,74,0.1); color:#16a34a; border-color:rgba(22,163,74,0.4); }
  body.light .btn-danger  { background:rgba(220,38,38,0.08); color:#dc2626; border-color:rgba(220,38,38,0.35); }
  .btn-full { width:100%; }
  .btn-sm { font-size:12px; padding:8px 10px; }

  /* ── MODAL ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; backdrop-filter:blur(6px); animation:fadeIn 0.2s ease; }
  .modal-box { background:var(--modal-bg); border:1px solid var(--border2); border-radius:16px; width:100%; max-width:900px; max-height:92vh; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,0.4); }
  .modal-header { padding:24px 28px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; }
  .modal-title { color:var(--text); font-size:20px; font-weight:700; letter-spacing:-0.02em; }
  .modal-subtitle { color:var(--text3); font-size:13px; margin-top:4px; }
  .modal-body { flex:1; overflow-y:auto; padding:24px 28px; background:var(--modal-bg); }
  .modal-footer { padding:16px 28px; border-top:1px solid var(--border); display:flex; gap:10px; background:var(--modal-bg); border-radius:0 0 16px 16px; }
  .close-btn { background:none; border:none; color:var(--text3); cursor:pointer; font-size:22px; line-height:1; padding:4px; }
  .close-btn:hover { color:var(--text); }

  /* ── GRIDS ── */
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .grid-actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .section-label { color:var(--text2); font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:12px; }

  /* ── INFO BLOCKS ── */
  .info-block { background:var(--info-bg); border:1px solid var(--info-border); border-radius:10px; padding:14px; }
  .info-block .lbl { color:var(--info-lbl); font-size:11px; margin-bottom:4px; }
  .info-block .val { color:var(--info-val); font-weight:600; font-size:14px; }
  .maint-row { background:var(--info-bg); border:1px solid var(--info-border); border-radius:10px; padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }

  /* ── TOASTS ── */
  .toast { position:fixed; top:20px; right:20px; z-index:2000; padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; animation:slideDown 0.25s ease; box-shadow:0 8px 30px rgba(0,0,0,0.25); }
  .toast-success { background:var(--toast-ok-bg);  border:1px solid #4ade80; color:#16a34a; }
  .toast-error   { background:var(--toast-err-bg); border:1px solid #f87171; color:#dc2626; }
  body:not(.light) .toast-success { color:#4ade80; }
  body:not(.light) .toast-error   { color:#f87171; }

  /* ── STATUS PILLS ── */
  .status-pills { display:flex; gap:10px; flex-wrap:wrap; }
  .status-pill { padding:10px 20px; border-radius:30px; font-size:13px; font-weight:700; cursor:pointer; border:2px solid transparent; transition:all 0.2s; letter-spacing:0.03em; }
  .status-pill.active-op    { background:rgba(74,222,128,0.15);  border-color:#4ade80; color:#16a34a; }
  .status-pill.active-mant  { background:rgba(250,204,21,0.15);  border-color:#facc15; color:#b45309; }
  .status-pill.active-ale   { background:rgba(248,113,113,0.15); border-color:#f87171; color:#dc2626; }
  .status-pill.active-admin { background:rgba(167,139,250,0.15); border-color:#a78bfa; color:#7c3aed; }
  .status-pill.inactive      { background:var(--bg2); border-color:var(--border2); color:var(--text3); }
  .status-pill.inactive-gray { background:rgba(148,163,184,0.12); border-color:rgba(148,163,184,0.3); color:var(--text2); }
  body:not(.light) .status-pill.active-op    { color:#4ade80; }
  body:not(.light) .status-pill.active-mant  { color:#facc15; }
  body:not(.light) .status-pill.active-ale   { color:#f87171; }
  body:not(.light) .status-pill.active-admin { color:#a78bfa; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     PANTALLA DE LOGIN
     ══════════════════════════════════════════ -->
<div id="login-screen" style="
  position:fixed;inset:0;background:#070a10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10000;gap:0;
">
  <canvas id="login-canvas" style="position:absolute;inset:0;opacity:0.3;"></canvas>

  <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:32px;width:100%;max-width:380px;padding:24px;">

    <!-- Ícono -->

      🚛
    </div>

    <!-- Título -->
    <div style="text-align:center;">
      <div style="font-family:'DM Sans',sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(135deg,#e2e8f0,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">

      <div style="display:flex;flex-direction:column;gap:6px;">

        <input id="login-user" type="text" placeholder="Tu usuario"

        <div style="position:relative;">
          <input id="login-pass" type="password" placeholder="Tu contraseña"

      <button onclick="doLogin()" id="login-btn"

<style>

<script>
// ══════════════════════════════════════════════════════
//  USUARIOS AUTORIZADOS — Edita aquí para agregar más
//  Formato: { usuario: "...", password: "..." }
// ══════════════════════════════════════════════════════
const USUARIOS_PERMITIDOS = [
  { usuario: "BMEXS1795",    password: "RESA950115"   },
  { usuario: "BMEXH4017", password: "MAAD931215"  },
  // ← Agrega más usuarios aquí siguiendo el mismo formato
];
// ══════════════════════════════════════════════════════

function doLogin() {
  const user = (document.getElementById("login-user")?.value || "").trim();
  const pass  = document.getElementById("login-pass")?.value || "";
  const errEl = document.getElementById("login-error");
  const btn   = document.getElementById("login-btn");

  const match = USUARIOS_PERMITIDOS.find(u => u.usuario === user && u.password === pass);

  if (match) {
    errEl.style.display = "none";
    btn.textContent = "✅ Acceso concedido…";
    btn.style.opacity = "0.7";
    // Ocultar pantalla de login con animación
    const loginScreen = document.getElementById("login-screen");
    loginScreen.style.transition = "opacity 0.4s ease";
    loginScreen.style.opacity = "0";
    setTimeout(() => {
      loginScreen.remove();
      const splash = document.getElementById("splash-screen");
      if (splash) splash.style.display = "flex";
      init();
    }, 420);
  } else {
    errEl.style.display = "block";
    // Shake animation en el botón
    btn.style.transform = "translateX(-6px)";
    setTimeout(() => { btn.style.transform = "translateX(6px)"; }, 80);
    setTimeout(() => { btn.style.transform = "translateX(-4px)"; }, 160);
    setTimeout(() => { btn.style.transform = ""; }, 240);
    document.getElementById("login-pass").value = "";
    document.getElementById("login-pass").focus();
  }
}

function toggleLoginPass() {
  const input = document.getElementById("login-pass");
  if (input) input.type = input.type === "password" ? "text" : "password";
}

// Partículas en el fondo del login — se inicia cuando el DOM está listo
function initLoginCanvas() {
  const canvas = document.getElementById("login-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const dots = Array.from({length:40}, () => ({
    x:  Math.random() * canvas.width,
    y:  Math.random() * canvas.height,
    r:  Math.random() * 1.4 + 0.4,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    a:  Math.random() * 0.4 + 0.1
  }));
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(34,211,238,${d.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
}
window.addEventListener("DOMContentLoaded", initLoginCanvas);

// ══════════════════════════════════════════════════════

let vehicles = [];
let _selectedStatus = null; // almacena el estatus elegido en el modal de edición

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3BY1F4iFo-QeULqJGNvOCuVznXZHfTlfsNN-Xwgfv-nHx04AvOeVUfhgZEtkv1ELpRw/exec";
const SHEET_URL       = "https://docs.google.com/spreadsheets/d/1mOTFHgkjFliZ5AX77SW-7aqZPgNbHSqBCClPd7dwEIY/edit?gid=674906336#gid=674906336";

let sheetsConectado = true;

async function apiGet(action, params = {}) {
  if (!sheetsConectado) return null;
  try {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
    return await res.json();
  } catch(e) {
    console.error("API GET error:", e);
    showToast("Error de conexión con Google Sheets", "error");
    return null;
  }
}

async function apiPost(action, data = {}) {
  if (!sheetsConectado) return null;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action, ...data })
    });
    return await res.json();
  } catch(e) {
    console.error("API POST error:", e);
    showToast("Error al guardar en Google Sheets", "error");
    return null;
  }
}

async function cargarDatosDesdeSheets() {
  try {
    const [vData, mData, mtData, rData] = await Promise.all([
      apiGet("getFlotilla"),
      apiGet("getMultas"),
      apiGet("getMantenimiento"),
      apiGet("getResguardos")
    ]);

    if (!vData) {
      showToast("No se pudo conectar con Google Sheets. Revisa la URL.", "error");
      return;
    }

    // Indexar resguardos por ECO para lookup rápido
    const resguardoMap = {};
    (rData || []).forEach(r => {
      const s = (v) => (v !== undefined && v !== null) ? String(v).trim() : "";
      resguardoMap[s(r.ECO)] = {
        direccion:  s(r.Direccion),
        licencia:   s(r.Licencia),
        domicilio:  s(r.Domicilio),
        fachada:    s(r.Fachada),
        gps:        s(r.GPS),
        conductor:  s(r.Operador),
      };
    });

    vehicles = vData.map(row => {
      const multas = (mData || []).filter(m => m.ECO === row.ECO);
      const mantos = (mtData || []).filter(m => m.ECO === row.ECO);
      const v = rowToVehicle(row, multas, mantos);
      // Inyectar resguardo desde hoja Resguardos
      if (resguardoMap[v.id]) v.resguardo = resguardoMap[v.id];
      return v;
    });

    sheetsConectado = true;
    showToast(`✅ ${vehicles.length} vehículos cargados desde Google Sheets`);
    render();
  } catch(e) {
    showToast("Error al cargar datos: " + e.message, "error");
  }
}

      s.id = "spin-style";
      s.textContent = "@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}";
      document.head.appendChild(s);
    }
  } else {
    document.getElementById("loading-msg").textContent = msg;
    el.style.display = "flex";
  }

function getDaysUntil(dateStr) {
  return Math.ceil((new Date(dateStr) - new Date()) / (1000 * 60 * 60 * 24));
}
function fmtDate(dateStr) {
  if (!dateStr || dateStr === "—") return "—";
  return new Date(dateStr).toLocaleDateString("es-MX");
}
function badge(status) {
  const c = STATUS_CONFIG[status] || {};
  return `<span style="display:inline-flex;align-items:center;gap:5px;background:${c.bg};border:1px solid ${c.border};color:${c.label};border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:0.05em;">
    <span style="width:6px;height:6px;border-radius:50%;background:${c.dot};box-shadow:0 0 6px ${c.dot};flex-shrink:0;"></span>
    ${status.toUpperCase()}
  </span>`;
}
function showToast(msg, type="success") {

function totalFinesCost(v) {
  return (v.fines || []).reduce((sum, f) => {
    const n = parseFloat((f.cost || "0").toString().replace(/[^0-9.]/g, "")) || 0;
    return sum + n;
  }, 0);
}
function totalGlobalFines() {
  return vehicles.reduce((sum, v) => sum + totalFinesCost(v), 0);
}
function totalMaintenanceCost(v) {
  return (v.maintenanceHistory || []).reduce((sum, h) => {
    const n = parseFloat((h.cost || "0").toString().replace(/[^0-9.]/g, "")) || 0;
    return sum + n;
  }, 0);
}
function totalGlobalMaintenance() {
  return vehicles.reduce((sum, v) => sum + totalMaintenanceCost(v), 0);
}
function fmtMoney(n) {
  return "$" + n.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ══════════════════════════════════════════════════════
// MOTOR DE ALERTAS AUTOMÁTICAS
// Documentos: Tarjeta Circulación, Póliza, Tenencia, Verificación, Mantenimiento
// Umbrales: vencido = rojo, ≤30 días = amarillo
// DESACTIVAR: basta con que la fecha de vencimiento sea futura (>30 días)
//             o borrando la fecha del campo correspondiente
// ══════════════════════════════════════════════════════
const ALERT_DAYS = 30;

function docAlertLevel(dateStr) {
  if (!dateStr || dateStr === "—" || dateStr === "") return null;
  const days = getDaysUntil(dateStr);
  if (days < 0)           return "vencido";
  if (days <= ALERT_DAYS) return "proximo";
  return "vigente";
}

function getVehicleAlerts(v) {
  const alerts = [];
  const checks = [
    { key:"tc",       label:"Tarjeta de Circulación", date: v.tcVencimiento || v.verificationDate },
    { key:"poliza",   label:"Póliza de Seguro",       date: v.polTermino },
    { key:"tenencia", label:"Tenencia",               date: v.tenenciaVencimiento },
    { key:"verif",    label:"Verificación",           date: v.verificacionVencimiento },
  ];
  for (const c of checks) {
    const level = docAlertLevel(c.date);
    if (level === "vencido" || level === "proximo") {
      const days = getDaysUntil(c.date);
      alerts.push({
        key: c.key, label: c.label, date: c.date, days, level,
        color: level === "vencido" ? "#f87171" : "#facc15",
        icon:  level === "vencido" ? "🔴" : "🟡",
        text:  level === "vencido"
          ? "Vencida el " + fmtDate(c.date)
          : "Vence en " + days + " día" + (days !== 1 ? "s" : "") + " · " + fmtDate(c.date)
      });
    }
  }
  if (v.nextMaintenance) {
    const days = getDaysUntil(v.nextMaintenance);
    if (days < 0) {
      alerts.push({ key:"maint", label:"Mantenimiento", days, level:"vencido", color:"#f87171", icon:"🔴", text:"Vencido el " + fmtDate(v.nextMaintenance) });
    } else if (days <= ALERT_DAYS) {
      alerts.push({ key:"maint", label:"Mantenimiento", days, level:"proximo", color:"#facc15", icon:"🟡", text:"En " + days + " día" + (days!==1?"s":"") + " · " + fmtDate(v.nextMaintenance) });
    }
  }
  return alerts;
}

// autoUpdateStatus eliminado — el estatus es SIEMPRE manual.
// Las alertas son solo un indicador visual independiente del estatus.
function autoUpdateStatus(v) { /* no-op: estatus es manual */ }

function docStatusBadge(dateStr) {
  const level = docAlertLevel(dateStr);
  if (!level) return "<span style=\"color:#475569;font-size:12px;\">Sin fecha</span>";
  if (level === "vencido") return "<span style=\"color:#f87171;font-weight:700;font-size:12px;\">🔴 VENCIDA</span>";
  if (level === "proximo") {
    const d = getDaysUntil(dateStr);
    return "<span style=\"color:#facc15;font-weight:700;font-size:12px;\">🟡 " + d + "d para vencer</span>";
  }
  return "<span style=\"color:#4ade80;font-weight:600;font-size:12px;\">✓ Vigente</span>";
}

// ══════════════════════════════════════════════════════
// ✅ FIX: función separada para evitar backticks anidados
// Antes era un IIFE escapado con \` que se renderizaba como texto
// ══════════════════════════════════════════════════════
function renderAlertsBlock(v) {
  const alerts = getVehicleAlerts(v);
  if (alerts.length === 0) return "";
  const rows = alerts.map(function(a) {
    return '<div style="display:flex;align-items:center;gap:10px;font-size:13px;">' +
      '<span>' + a.icon + '</span>' +
      '<span style="color:var(--text2);min-width:150px;">' + a.label + '</span>' +
      '<span style="color:' + a.color + ';font-weight:600;">' + a.text + '</span>' +
      '</div>';
  }).join('');
  return '<div style="background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.2);border-radius:12px;padding:14px 18px;margin-bottom:20px;">' +
    '<div style="color:#f87171;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;">⚠️ Alertas Activas · ' + alerts.length + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:6px;">' + rows + '</div>' +
    '</div>';
}

function addFine(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const motivo    = document.getElementById(`fine-motivo-${id}`)?.value?.trim();
  const costoRaw  = document.getElementById(`fine-costo-${id}`)?.value?.trim();
  const fecha     = document.getElementById(`fine-fecha-${id}`)?.value;
  const evidencia = document.getElementById(`fine-evidencia-${id}`)?.value?.trim();
  if (!motivo) { showToast("Escribe el motivo de la multa", "error"); return; }
  if (!costoRaw || isNaN(parseFloat(costoRaw)) || parseFloat(costoRaw) <= 0) {
    showToast("Ingresa un costo válido mayor a cero", "error"); return;
  }
  if (!v.fines) v.fines = [];
  const multaId = "MUL-" + Date.now();
  const fineObj = {
    multa_id: multaId,
    motivo,
    cost: parseFloat(costoRaw),
    fecha: fecha ? fmtDate(fecha) : new Date().toLocaleDateString("es-MX"),
    evidencia: evidencia || ""
  };
  v.fines.push(fineObj);
  if (sheetsConectado) {
    const multaRow = { ID: multaId, ECO: id, Placa: v.plate || "", Motivo: fineObj.motivo, Costo: fineObj.cost, Fecha: fineObj.fecha, Evidencia: fineObj.evidencia, Registrado: "Admin" };
    apiPost("addMulta", { data: multaRow }).then(res => { if (res && res.ok) showToast(`✅ Multa guardada en Google Sheets`); });
  }
  showToast(`Multa registrada: ${fmtMoney(parseFloat(costoRaw))}`);
  openDetailModal(id);
  render();
}

function removeFine(id, idx) {
  const v = vehicles.find(x => x.id === id);
  if (!v || !v.fines) return;
  const removed = v.fines.splice(idx, 1);
  if (sheetsConectado && removed[0]?.multa_id) {
    apiPost("deleteMulta", { id: removed[0].multa_id }).then(res => { if (res && res.ok) showToast("✅ Multa eliminada de Google Sheets"); });
  }
  showToast("Multa eliminada");
  openDetailModal(id);
  render();
}

function registerVehicle() {
  const eco = g("nv-eco"), plate = g("nv-plate"), marca = g("nv-marca"), year = g("nv-year");
  if (!eco || !plate || !marca || !year) { showToast("Completa: N° Económico, Placa, Marca y Año", "error"); nvShowTab(0); return; }
  if (vehicles.find(v => v.id === eco)) { showToast("Ya existe un vehículo con ese N° Económico", "error"); return; }

  const newV = {
    id: eco, plate, model: `${marca}${g("nv-submarca") ? " "+g("nv-submarca") : ""} ${year}`.trim(),
    year: parseInt(year), marca, submarca: g("nv-submarca"),
    type: g("nv-type")||"Otro", fuelType: g("nv-fuel")||"Gasolina",
    driver: g("nv-driver")||"Sin asignar", location: g("nv-location")||"Base Central", usuario: g("nv-usuario")||"—",
    mileage: g("nv-mileage")||"0 km", status: g("nv-status")||"Operando",
    fechaAlta: g("nv-fecha"), motor: g("nv-motor"), serie: g("nv-serie"),
    color: g("nv-color"), estado: g("nv-estado"), prop: g("nv-prop"),
    esquema: g("nv-esquema"), facturadoPor: g("nv-facturado"), beneficiario: g("nv-beneficiario"),
    tabulador: g("nv-tabulador"), zona: g("nv-zona"), ciudad: g("nv-ciudad"),
    tienda: g("nv-tienda"), colaborador: g("nv-colaborador"),
    placaEmision: g("nv-placa-emision"), placaVencimiento: g("nv-placa-vencimiento"),
    tcEmision: g("nv-tc-emision"), tcVencimiento: g("nv-tc-vencimiento"),
    tenenciaVencimiento: g("nv-tenencia-venc"), verificacionVencimiento: g("nv-verif-venc"),
    verificationDate: g("nv-tc-vencimiento")||"—", verificationStatus: g("nv-pol-estatus")||"Vigente",
    aseg: g("nv-aseg"), poliza: g("nv-poliza"), polInicio: g("nv-pol-inicio"),
    polTermino: g("nv-pol-termino"), polDias: g("nv-pol-dias"), polEstatus: g("nv-pol-estatus"),
    lastMaintenance: new Date().toISOString().split("T")[0],
    nextMaintenance: new Date(Date.now()+90*24*60*60*1000).toISOString().split("T")[0],
    maintenanceHistory: [], fines: [],
    links: { factura: g("nv-link-factura"), tc: g("nv-link-tc"), expediente: g("nv-link-expediente"),
      foto: g("nv-link-foto"), tenencia: g("nv-link-tenencia"), fichaTenencia: g("nv-link-ficha-tenencia"), polizaDigital: g("nv-link-poliza") }
  };
  vehicles.push(newV);
  if (sheetsConectado) {
    showLoadingOverlay("Guardando vehículo…");
    apiPost("saveVehiculo", { data: vehicleToRow(newV) }).then(res => {
      hideLoadingOverlay();
      if (res && res.ok) showToast(`✅ ${eco} guardado en Google Sheets`);
      else showToast("Guardado local OK · Error en Sheets", "error");
    });
  }
  closeModal(); showToast(`Vehículo ${eco} registrado`); render();
}

function getStatusInfoText(status) {
  if (status === "Operando")            return "🟢 El vehículo estará marcado como <strong style='color:#4ade80'>Operando</strong>.";
  if (status === "Mantenimiento")       return "🟡 El vehículo se marcará en <strong style='color:#facc15'>Mantenimiento</strong>.";
  if (status === "Siniestrada")         return "🔴 El vehículo está marcado como <strong style='color:#f87171'>Siniestrada</strong>.";
  if (status === "Sin Uso")             return "⚪ El vehículo está marcado como <strong style='color:#94a3b8'>Sin Uso</strong>.";
  if (status === "Uso Administrativo")  return "🏢 El vehículo está marcado como <strong style='color:#a78bfa'>Uso Administrativo</strong>.";
  return "";
}

function evSelectStatus(s) {
  _selectedStatus = s; // guardar en variable global, no depender del DOM
  const el = document.getElementById("ev-status");
  if (el) el.value = s;
  ["Operando","Mantenimiento","Siniestrada","Sin Uso","Uso Administrativo"].forEach(opt => {
    const pill = document.getElementById(`ev-pill-${opt.replace(/ /g,"-")}`);
    if (!pill) return;
    const activeClass = opt==="Operando"?"active-op":opt==="Mantenimiento"?"active-mant":opt==="Siniestrada"?"active-ale":opt==="Uso Administrativo"?"active-admin":"inactive-gray";
    pill.className = "status-pill " + (opt===s ? activeClass : "inactive");
  });
  const info = document.getElementById("ev-status-info");
  if (info) info.innerHTML = getStatusInfoText(s);
}

function saveEdit(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const gv = (eid) => document.getElementById(eid)?.value?.trim() || "";
  if (gv("ev-fecha"))        v.fechaAlta    = gv("ev-fecha");
  if (gv("ev-marca"))        v.marca        = gv("ev-marca");
  v.submarca = gv("ev-submarca");
  if (gv("ev-year"))         v.year         = parseInt(gv("ev-year"));
  if (gv("ev-plate"))        v.plate        = gv("ev-plate");
  if (gv("ev-estado"))       v.estado       = gv("ev-estado");
  if (gv("ev-motor"))        v.motor        = gv("ev-motor");
  if (gv("ev-serie"))        v.serie        = gv("ev-serie");
  const tipo = document.getElementById("ev-type")?.value; if (tipo) v.type = tipo;
  if (gv("ev-color"))        v.color        = gv("ev-color");
  const fuel = document.getElementById("ev-fuel")?.value; if (fuel) v.fuelType = fuel;
  if (gv("ev-mileage"))      v.mileage      = gv("ev-mileage");
  if (gv("ev-prop"))         v.prop         = gv("ev-prop");
  if (gv("ev-esquema"))      v.esquema      = gv("ev-esquema");
  if (gv("ev-facturado"))    v.facturadoPor = gv("ev-facturado");
  if (gv("ev-beneficiario")) v.beneficiario = gv("ev-beneficiario");
  if (gv("ev-tabulador"))    v.tabulador    = gv("ev-tabulador");
  if (gv("ev-driver"))       v.driver       = gv("ev-driver");
  if (gv("ev-location"))     v.location     = gv("ev-location");
  if (gv("ev-usuario"))      v.usuario      = gv("ev-usuario");
  if (gv("ev-zona"))         v.zona         = gv("ev-zona");
  if (gv("ev-ciudad"))       v.ciudad       = gv("ev-ciudad");
  if (gv("ev-tienda"))       v.tienda       = gv("ev-tienda");
  if (gv("ev-colaborador"))  v.colaborador  = gv("ev-colaborador");
  // Leer de variable global (el input hidden puede no estar en DOM al momento de guardar)
  const status = _selectedStatus || document.getElementById("ev-status")?.value || v.status;
  v.status = status;
  _selectedStatus = null; // limpiar
  v.model = `${v.marca}${v.submarca ? " " + v.submarca : ""} ${v.year}`.trim();
  if (gv("ev-placa-emision"))     v.placaEmision     = gv("ev-placa-emision");
  if (gv("ev-placa-vencimiento")) v.placaVencimiento = gv("ev-placa-vencimiento");
  if (gv("ev-tc-emision"))        v.tcEmision        = gv("ev-tc-emision");
  if (gv("ev-tc-vencimiento"))   { v.tcVencimiento = gv("ev-tc-vencimiento"); v.verificationDate = gv("ev-tc-vencimiento"); }
  if (gv("ev-tenencia-venc"))     v.tenenciaVencimiento     = gv("ev-tenencia-venc");
  if (gv("ev-verif-venc"))        v.verificacionVencimiento = gv("ev-verif-venc");
  if (gv("ev-aseg"))       v.aseg       = gv("ev-aseg");
  if (gv("ev-poliza"))     v.poliza     = gv("ev-poliza");
  if (gv("ev-pol-inicio")) v.polInicio  = gv("ev-pol-inicio");
  if (gv("ev-pol-termino"))v.polTermino = gv("ev-pol-termino");
  if (gv("ev-pol-dias"))   v.polDias    = gv("ev-pol-dias");
  const polEst = document.getElementById("ev-pol-estatus")?.value;
  if (polEst) { v.polEstatus = polEst; v.verificationStatus = polEst; }
  if (!v.links) v.links = {};
  v.links.factura       = gv("ev-link-factura");
  v.links.tc            = gv("ev-link-tc");
  v.links.expediente    = gv("ev-link-expediente");
  v.links.foto          = gv("ev-link-foto");
  v.links.tenencia      = gv("ev-link-tenencia");
  v.links.fichaTenencia = gv("ev-link-ficha-tenencia");
  v.links.polizaDigital = gv("ev-link-poliza");
  if (sheetsConectado) {
    showLoadingOverlay(`Actualizando ${id}…`);
    apiPost("saveVehiculo", { data: vehicleToRow(v) }).then(res => {
      hideLoadingOverlay();
      if (res && res.ok) showToast(`✅ ${id} actualizado en Google Sheets`);
      else showToast("Local OK · Error Sheets", "error");
    });
  }
  closeModal(); showToast(`${id} actualizado · ${v.status}`); render();
}

function confirmarMantenimientoRealizado(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const costoRaw = document.getElementById("mant-real-costo-"+id)?.value?.trim() || "0";
  const costo = parseFloat(costoRaw.replace(/[^0-9.]/g,"")) || 0;
  const tipo   = document.getElementById("mant-real-tipo-"+id)?.value   || "Servicio Programado";
  const taller = document.getElementById("mant-real-taller-"+id)?.value?.trim() || "";
  const desc   = document.getElementById("mant-real-desc-"+id)?.value?.trim()   || ("Mantenimiento realizado · " + fmtDate(v.nextMaintenance));
  const mantObj = {
    type: tipo,
    description: desc,
    cost: costo,
    date: new Date().toISOString().split("T")[0],
    taller: taller
  };
  if (!v.maintenanceHistory) v.maintenanceHistory = [];
  v.maintenanceHistory.push(mantObj);
  v.lastMaintenance = mantObj.date;
  v.nextMaintenance = new Date(Date.now() + 90*24*60*60*1000).toISOString().split("T")[0];
  if (sheetsConectado) {
    const mantRow = { ID:"MNT-"+Date.now(), ECO:id, Placa: v.plate || "", Tipo:mantObj.type, Descripcion:mantObj.description, Costo:costo.toString(), Fecha:mantObj.date, Taller:taller };
    showLoadingOverlay("Guardando mantenimiento…");
    Promise.all([apiPost("addMantenimiento",{data:mantRow}), apiPost("saveVehiculo",{data:vehicleToRow(v)})]).then(()=>{ hideLoadingOverlay(); });
  }
  closeModal();
  showToast("✅ Mantenimiento registrado: " + fmtMoney(costo));
  render();
}

function confirmarReagenda(id) {
  const v = vehicles.find(x => x.id === id);
  const fecha = document.getElementById("reagenda-fecha")?.value;
  if (!fecha) { showToast("Selecciona una fecha", "error"); return; }
  v.nextMaintenance = fecha;
  if (sheetsConectado) {
    apiPost("saveVehiculo", { data: vehicleToRow(v) }).then(()=>{});
  }
  closeModal();
  showToast("📅 Mantenimiento reagendado para " + fmtDate(fecha));
  render();
}

function agendarMantenimiento(id, programar) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const tipo   = document.getElementById("mant-tipo-"+id)?.value || "Servicio Menor";
  const fecha  = document.getElementById("mant-fecha-"+id)?.value || "";
  const desc   = document.getElementById("mant-desc-"+id)?.value?.trim() || "";
  const taller = document.getElementById("mant-taller-"+id)?.value?.trim() || "";
  const costoRaw = document.getElementById("mant-costo-"+id)?.value?.trim() || "0";
  const costo = parseFloat(costoRaw.replace(/[^0-9.]/g, "")) || 0;

  // Si eligió "Agendar con fecha", la fecha es obligatoria
  if (programar && !fecha) { showToast("Selecciona una fecha para agendar", "error"); return; }

  const mantObj = { type: tipo, description: desc, cost: costo, date: fecha || new Date().toISOString().split("T")[0], taller };
  if (!v.maintenanceHistory) v.maintenanceHistory = [];
  v.maintenanceHistory.push(mantObj);

  // Solo actualizar próximo mantenimiento si se programó con fecha
  if (programar && fecha) {
    v.nextMaintenance = fecha;
  }

  if (sheetsConectado) {
    const mantRow = { ID:"MNT-"+Date.now(), ECO:id, Placa: v.plate || "", Tipo:tipo, Descripcion:desc, Costo:costo.toString(), Fecha:mantObj.date, Taller:taller };
    showLoadingOverlay("Guardando mantenimiento…");
    Promise.all([apiPost("addMantenimiento",{data:mantRow}), apiPost("saveVehiculo",{data:vehicleToRow(v)})]).then(([r1])=>{
      hideLoadingOverlay();
      if (r1?.ok) showToast("✅ Mantenimiento guardado"); else showToast("Error al guardar mantenimiento","error");
    });
  }
  closeModal();
  showToast(programar ? `📅 Mantenimiento agendado: ${fmtDate(fecha)}` : `💾 Mantenimiento guardado sin programar`);
  render();
}

async function openResguardoModal(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const r = v.resguardo || {};

  // Mostrar modal de carga mientras consultamos el Registro Diario
  openModal(buildModal(
    `🏠 Resguardo · ${v.id}`,
    `${v.plate} · ${v.model} · Conductor: ${v.driver}`,
    `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:16px;">
       <div style="width:36px;height:36px;border:3px solid rgba(251,191,36,0.2);border-top-color:#fbbf24;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
       <div style="color:var(--text3);font-size:13px;">Buscando licencia en Registro Diario…</div>
     </div>
     <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`,
    ``
  ));

  // Consultar hoja Registros buscando el conductor asignado
  let licenciaDesdeRegistro = "";
  let registroEncontrado = false;
  if (sheetsConectado && v.driver && v.driver !== "Sin asignar") {
    try {
      const datos = await apiGet("getRegistros", { conductor: v.driver });
      if (datos && Array.isArray(datos) && datos.length > 0) {
        // Tomar el registro más reciente (último del array)
        const ultimo = datos[datos.length - 1];
        licenciaDesdeRegistro = (ultimo.fotoLicencia || ultimo.FotoLicencia || "").trim();
        registroEncontrado = true;
      }
    } catch(e) {
      console.warn("No se pudo consultar Registros:", e);
    }

  // Si ya hay una licencia guardada en resguardo, usarla; si no, usar la del Registro Diario

  const hasData = r.licencia || r.domicilio || r.fachada || r.gps;

         </div>`
    : "";

    <div style="color:#fbbf24;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;">✏️ ${hasData ? "Actualizar" : "Registrar"} Resguardo</div>

        <label>Dirección de Resguardo</label>

        </div>

function saveResguardo(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const gv = (eid) => document.getElementById(eid)?.value?.trim() || "";
  if (!v.resguardo) v.resguardo = {};
  v.resguardo.conductor = v.driver || "";
  v.resguardo.direccion = gv(`rsg-direccion-${id}`);
  v.resguardo.licencia  = gv(`rsg-licencia-${id}`);
  v.resguardo.domicilio = gv(`rsg-domicilio-${id}`);
  v.resguardo.fachada   = gv(`rsg-fachada-${id}`);
  v.resguardo.gps       = gv(`rsg-gps-${id}`);
  if (sheetsConectado) {
    showLoadingOverlay("Guardando resguardo…");
    const resguardoRow = {
      ECO:        v.id,
      Placa:      v.plate,
      Tienda:     v.tienda  || "",
      Operador:   v.driver  || "",
      Direccion:  v.resguardo.direccion,
      Licencia:   v.resguardo.licencia,
      Domicilio:  v.resguardo.domicilio,
      Fachada:    v.resguardo.fachada,
      GPS:        v.resguardo.gps,
      FechaActualizacion: new Date().toLocaleDateString("es-MX")
    };
    apiPost("saveResguardo", { data: resguardoRow }).then(res => {
      hideLoadingOverlay();
      if (res && res.ok) showToast(`✅ Resguardo guardado en Google Sheets`);
      else showToast("Guardado local OK · Error Sheets", "error");
    });
  }
  closeModal();
  showToast(`🏠 Resguardo de ${id} guardado`);
  render();
}

function addFineFromModal(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  const motivo    = document.getElementById("fine-motivo-"+id)?.value?.trim();
  const costoRaw  = document.getElementById("fine-costo-"+id)?.value?.trim();
  const fecha     = document.getElementById("fine-fecha-"+id)?.value;
  const evidencia = document.getElementById("fine-evidencia-"+id)?.value?.trim();
  if (!motivo) { showToast("Escribe el motivo", "error"); return; }
  if (!costoRaw || parseFloat(costoRaw) <= 0) { showToast("Ingresa un costo válido", "error"); return; }
  if (!v.fines) v.fines = [];
  const multaId = "MUL-" + Date.now();
  const fineObj = { multa_id: multaId, motivo, cost: parseFloat(costoRaw), fecha: fecha ? fmtDate(fecha) : new Date().toLocaleDateString("es-MX"), evidencia: evidencia || "" };
  v.fines.push(fineObj);
  if (sheetsConectado) {
    const multaRow = { ID: multaId, ECO:id, Placa: v.plate || "", Motivo:fineObj.motivo, Costo:fineObj.cost, Fecha:fineObj.fecha, Evidencia:fineObj.evidencia };
    apiPost("addMulta", { data: multaRow }).then(()=>{});
  }
  showToast("Multa registrada: " + fmtMoney(parseFloat(costoRaw)));
  openFinesModal(id);
  render();
}

function removeFineFromModal(id, idx) {
  const v = vehicles.find(x => x.id === id);
  if (!v || !v.fines) return;
  const removed = v.fines.splice(idx, 1);
  if (sheetsConectado && removed[0]?.multa_id) {
    apiPost("deleteMulta", { id: removed[0].multa_id }).then(()=>{});
  }
  showToast("Multa eliminada");
  openFinesModal(id);
  render();
}

function buildQRText(v) {
  const lines = [`PLACA: ${v.plate}`, `MARCA: ${v.marca||v.model}`];
  if (v.submarca) lines.push(`SUBMARCA: ${v.submarca}`);
  const tcLink = v.links?.tc||"", polLink = v.links?.polizaDigital||"";
  if (tcLink||polLink) { lines.push("","--- DOCUMENTOS ---"); if(tcLink) lines.push(`TARJETA CIRCULACION: ${tcLink}`); if(polLink) lines.push(`POLIZA DIGITAL: ${polLink}`); }
  return lines.join("\n");
}

function generarQR(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v || v.qrGenerated) { showToast("Este vehículo ya tiene un QR", "error"); return; }
  const text = buildQRText(v);
  if (!text.trim()) { showToast("Sin datos para generar QR", "error"); return; }
  const container = document.getElementById(`qr-canvas-${id}`);
  if (!container) return;
  container.innerHTML = "";
  new QRCode(container, { text, width: 186, height: 186, correctLevel: QRCode.CorrectLevel.M });
  v.qrGenerated = true; v.qrText = text;
  setTimeout(() => { closeModal(); openQRModal(id); showToast(`QR generado para ${id}`); }, 400);
}

function descargarQR(id) {
  const v = vehicles.find(x => x.id === id);
  const nombre = v ? (v.plate||v.id) : id;
  let canvas, img;
  for (const sel of [`#qr-canvas-${id}`,`#qr-render-${id}`]) {
    const el = document.querySelector(sel);
    if (!el) continue;
    canvas = el.querySelector("canvas"); img = el.querySelector("img");
    if (canvas||img) break;
  }
  if (canvas) {
    const tmp = document.createElement("canvas"); tmp.width = tmp.height = 236;
    tmp.getContext("2d").drawImage(canvas, 0, 0, 236, 236);
    tmp.toBlob(blob => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `qr-${nombre}.png`; a.click(); }, "image/png");
  } else if (img) {
    const a = document.createElement("a"); a.href = img.src; a.download = `qr-${nombre}.png`; a.click();
  } else { showToast("No se encontró QR para descargar", "error"); }
}

function openNotificationsModal() {
  const alertVehicles = vehicles.filter(v => getVehicleAlerts(v).length > 0);
  const vencidos = alertVehicles.filter(v => getVehicleAlerts(v).some(a => a.level==="vencido"));
  const proximos = alertVehicles.filter(v => !getVehicleAlerts(v).some(a=>a.level==="vencido") && getVehicleAlerts(v).some(a=>a.level==="proximo"));

  function renderGroup(title, color, list) {
    if (!list.length) return "";
    return `<div style="color:${color};font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 10px;">${title} · ${list.length}</div>` +
      list.map(v => {
        const alerts = getVehicleAlerts(v);
        return `<div style="background:var(--card-bg);border:1px solid ${color}30;border-radius:10px;padding:16px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <div><span style="color:#22d3ee;font-family:'DM Mono',monospace;font-weight:600;font-size:13px;">${v.id}</span>
            <span style="color:var(--text3);font-size:12px;margin-left:8px;">${v.plate} · ${v.model}</span></div>
            ${badge(v.status)}

          <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
            ${alerts.map(a=>`<div style="display:flex;align-items:center;gap:8px;font-size:13px;">
              <span>${a.icon}</span><span style="color:var(--text2);min-width:160px;">${a.label}</span>
              <span style="color:${a.color};font-weight:600;">${a.text}</span></div>`).join("")}
          </div>
          <button class="btn btn-ghost" style="font-size:12px;padding:6px 14px;" onclick="closeModal();openDetailModal('${v.id}')">Ver detalles →</button>
        </div>`;
      }).join("");
  }

  const body = alertVehicles.length === 0
    ? `<div style="color:var(--text3);text-align:center;padding:60px 20px;"><div style="font-size:40px;margin-bottom:12px;">✅</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">Todo en orden</div><div style="font-size:13px;">Sin documentos vencidos ni próximos a vencer.</div></div>`
    : renderGroup("🔴 VENCIDOS","#f87171",vencidos) + renderGroup("🟡 PRÓXIMOS A VENCER","#facc15",proximos);

  openModal(buildModal(
    `Notificaciones · ${alertVehicles.length}`,
    alertVehicles.length>0 ? `${vencidos.length} vencido(s) · ${proximos.length} próximo(s) a vencer` : null,
    body, null
  ));
}

function openOtrosModal() {
  const ESTATUS_PRINCIPALES = ["Operando","Mantenimiento","Siniestrada","Sin Uso","Uso Administrativo"];
  const otrosVeh = vehicles.filter(v => !ESTATUS_PRINCIPALES.includes(v.status));

  // Agrupar por estatus real
  const byStatus = {};
  otrosVeh.forEach(v => {
    const s = v.status && v.status.trim() !== "" ? v.status : "Sin Estatus";
    if (!byStatus[s]) byStatus[s] = [];
    byStatus[s].push(v);
  });

  const estatusList = Object.keys(byStatus).sort();

  const body = otrosVeh.length === 0
    ? `<div style="color:var(--text3);text-align:center;padding:60px 20px;">
        <div style="font-size:40px;margin-bottom:12px;">📦</div>
        <div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;">Sin vehículos en Otros</div>
        <div style="font-size:13px;">Todos los vehículos tienen uno de los 4 estatus principales.</div>
      </div>`
    : estatusList.map(est => {
        const lista = byStatus[est];
        return `
          <div style="margin-bottom:24px;">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="background:rgba(251,146,60,0.15);border:1px solid rgba(251,146,60,0.35);border-radius:8px;padding:4px 14px;color:#fb923c;font-size:12px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;">${est}</div>
              <div style="color:#475569;font-size:12px;">${lista.length} unidad${lista.length!==1?'es':''}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              ${lista.map(v => `
                <div style="background:var(--info-bg);border:1px solid var(--info-border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                  <div>
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
                      <span style="color:#22d3ee;font-family:'DM Mono',monospace;font-weight:600;font-size:13px;">${v.id}</span>
                      <span style="color:#475569;font-size:12px;">${v.plate}</span>
                      <span style="background:rgba(251,146,60,0.12);border:1px solid rgba(251,146,60,0.3);color:#fb923c;border-radius:12px;padding:2px 9px;font-size:11px;font-weight:700;">${v.status||"Sin Estatus"}</span>
                    </div>
                    <div style="color:var(--text2);font-size:13px;font-weight:600;">${v.model}</div>
                    <div style="color:#475569;font-size:12px;margin-top:2px;">👤 ${v.driver} · 📍 ${v.location} · 🚛 ${v.type||"—"}</div>
                  </div>
                  <button class="btn btn-ghost" style="font-size:12px;padding:6px 14px;border-color:rgba(34,211,238,0.3);color:#22d3ee;" onclick="closeModal();openDetailModal('${v.id}')">Ver detalles →</button>
                </div>`).join('')}
            </div>
          </div>`;
      }).join('');

  const resumen = estatusList.map(s => `<span style="background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.25);border-radius:6px;padding:3px 10px;color:#fb923c;font-size:12px;font-weight:700;">${s}: ${byStatus[s].length}</span>`).join(' ');

  openModal(buildModal(
    `📦 Otros · ${otrosVeh.length} unidad${otrosVeh.length!==1?'es':''}`,
    `Vehículos con estatus distinto a los 5 principales`,
    `${otrosVeh.length>0?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">${resumen}</div>`:''}${body}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`
  ));
}

function renderCards() {
  // Guarda foco y posición del cursor antes de re-renderizar
  const el  = document.getElementById("search-input");
  const pos = el ? el.selectionStart : null;
  render();
  const el2 = document.getElementById("search-input");
  if (el2 && pos !== null) {
    el2.focus();
    el2.setSelectionRange(pos, pos);
  }
}

        <ol style="color:#94a3b8;font-size:13px;line-height:2;padding-left:18px;">
          <li>Crea un Google Sheet con hojas: <strong style="color:#e2e8f0">Vehículos, Multas, Mantenimiento</strong></li>
          <li>Abre Apps Script → pega el código backend</li>
          <li>Publica como Web App → Acceso: Cualquier persona</li>
          <li>Copia la URL y pégala abajo</li>
        </ol>
      </div>
      <div class="field"><label>URL de Apps Script *</label><input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/AKfy.../exec" /></div>
      <div class="field"><label>URL de Google Sheet</label><input type="text" id="cfg-sheet" placeholder="https://docs.google.com/spreadsheets/d/..." /></div>
    </div>`;
  openModal(buildModal("Configurar Google Sheets","Conecta tu hoja de cálculo",body,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-primary" onclick="aplicarConfigSheets()">✅ Conectar</button>`));
}

async function aplicarConfigSheets() {
  const url   = document.getElementById("cfg-url")?.value?.trim();
  const sheet = document.getElementById("cfg-sheet")?.value?.trim();
  if (!url) { showToast("Pega la URL de Apps Script", "error"); return; }
  window._APPS_SCRIPT_URL = url;
  window._SHEET_URL = sheet;
  closeModal();
  sheetsConectado = true;
  window.apiGet = async (action, params={}) => {
    try { const qs = new URLSearchParams({action,...params}).toString(); const res = await fetch(`${window._APPS_SCRIPT_URL}?${qs}`); return await res.json(); }
    catch(e) { showToast("Error de conexión","error"); return null; }
  };
  window.apiPost = async (action, data={}) => {
    try { const res = await fetch(window._APPS_SCRIPT_URL, {method:"POST",body:JSON.stringify({action,...data})}); return await res.json(); }
    catch(e) { showToast("Error al guardar","error"); return null; }
  };
  await cargarDatosDesdeSheets();
}

function toggleTheme() {
  const isDark = !document.body.classList.contains("light");
  document.body.classList.toggle("light", isDark);
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("theme", isDark ? "light" : "dark");
}

// Restore saved theme
(function() {
  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    // btn not yet rendered, render() will pick it up
  }
})();

async function init() {
  // Arranca splash
  initSplash();
  splashProgress(10, "Conectando con Google Sheets…");

  if (APPS_SCRIPT_URL && APPS_SCRIPT_URL !== "PEGA_TU_URL_AQUI") {
    splashProgress(30, "Obteniendo vehículos…");
    await cargarDatosDesdeSheets();
    splashProgress(100, "¡Listo!");
  } else {
    sheetsConectado = false;
    splashProgress(100, "Carga local lista");
    render();
  }
  setTimeout(hideSplash, 420);
}

// ── SPLASH FUNCTIONS ──
function initSplash() {
  const canvas = document.getElementById("splash-canvas");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;

  const dots = Array.from({length: 55}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.6 + 0.4,
    vx: (Math.random() - 0.5) * 0.35,
    vy: (Math.random() - 0.5) * 0.35,
    a: Math.random() * 0.5 + 0.1
  }));

  let raf;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = canvas.width;
      if (d.x > canvas.width) d.x = 0;
      if (d.y < 0) d.y = canvas.height;
      if (d.y > canvas.height) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(34,211,238,${d.a})`;
      ctx.fill();
    });
    // líneas entre puntos cercanos
    for (let i = 0; i < dots.length; i++) {
      for (let j = i+1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = `rgba(34,211,238,${0.06 * (1 - dist/110)})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    raf = requestAnimationFrame(draw);
  }
  draw();
  canvas._stopRaf = () => cancelAnimationFrame(raf);

  // Mensajes rotativos
  const msgs = [
    "Conectando con Google Sheets…",
    "Cargando vehículos de la flota…",
    "Obteniendo historial de multas…",
    "Sincronizando mantenimientos…",
    "Preparando el panel de control…"
  ];
  let mi = 0;
  canvas._msgInterval = setInterval(() => {
    mi = (mi + 1) % msgs.length;
    const el = document.getElementById("splash-msg");
    if (el) { el.style.opacity = "0"; setTimeout(() => { el.textContent = msgs[mi]; el.style.opacity = "1"; }, 200); }
  }, 1800);
}

function splashProgress(pct, msg) {
  const bar = document.getElementById("splash-bar");
  const msgEl = document.getElementById("splash-msg");
  if (bar) bar.style.width = pct + "%";
  if (msg && msgEl) { msgEl.style.opacity = "0"; setTimeout(() => { msgEl.textContent = msg; msgEl.style.opacity = "1"; }, 150); }
}

function hideSplash() {
  const splash = document.getElementById("splash-screen");
  if (!splash) return;
  const canvas = document.getElementById("splash-canvas");
  if (canvas) {
    if (canvas._stopRaf) canvas._stopRaf();
    if (canvas._msgInterval) clearInterval(canvas._msgInterval);
  }
  splash.style.animation = "splashOut 0.55s ease forwards";
  setTimeout(() => splash.remove(), 560);
}

// init() ahora se llama desde doLogin() al autenticarse correctamente

// ── AUTO-REFRESH cada 15 segundos ──
setInterval(async () => {
  if (!sheetsConectado) return;
  try {
    const [vData, mData, mtData, rData] = await Promise.all([
      apiGet("getFlotilla"),
      apiGet("getMultas"),
      apiGet("getMantenimiento"),
      apiGet("getResguardos")
    ]);
    if (!vData) return;
    const resguardoMap = {};
    (rData || []).forEach(r => {
      const s = (v) => (v !== undefined && v !== null) ? String(v).trim() : "";
      resguardoMap[s(r.ECO)] = { direccion:s(r.Direccion), licencia:s(r.Licencia), domicilio:s(r.Domicilio), fachada:s(r.Fachada), gps:s(r.GPS), conductor:s(r.Operador) };
    });
    vehicles = vData.map(row => {
      const multas = (mData || []).filter(m => m.ECO === row.ECO);
      const mantos = (mtData || []).filter(m => m.ECO === row.ECO);
      const v = rowToVehicle(row, multas, mantos);
      if (resguardoMap[v.id]) v.resguardo = resguardoMap[v.id];
      return v;
    });
    render();
  } catch(e) { console.warn("Auto-refresh error:", e); }
}, 10000);
</script>
